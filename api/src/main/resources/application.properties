spring.application.name=carrito

# Credenciales: se leen del archivo .env de la raíz del repo (no se sube a GitHub).
# Copia .env.example como .env y pon tus datos.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Las tablas ya existen (script cc.sql): JPA no las crea ni las cambia.
spring.jpa.hibernate.ddl-auto=none

# Las columnas de cc están en camelCase (idProducto, codUsuario): se usan tal cual,
# sin que Hibernate las pase a id_producto.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Los errores (404, 400) incluyen el mensaje: "No existe el producto 99"
spring.web.error.include-message=always
