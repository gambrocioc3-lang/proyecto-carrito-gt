spring.application.name=carrito

# Credenciales: se leen del archivo .env de la raíz del repo (no se sube a GitHub).
# Copia .env.example como .env y pon tus datos.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Las tablas ya existen (script cc.sql): JPA no las crea ni las cambia.
spring.jpa.hibernate.ddl-auto=none
